version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      # The OpenTelemetry crate family shares one API contract; bumping a
      # single crate on its own breaks the build (see #355-#359, replaced by
      # #360). Keep this group ahead of cargo-minor-and-patch so dependabot's
      # first-match-wins rule routes these crates here. These crates are
      # pre-1.0, so breaking changes ship as minor releases: major is
      # included too so every update type stays grouped together.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "kind:chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "kind:chore"
    ignore:
      # dtolnay/rust-toolchain tags track the targeted Rust version
      # (1.89 = Rust 1.89), not the action's own semver. Bumps are
      # driven by the MSRV policy, not by dependabot.
      - dependency-name: "dtolnay/rust-toolchain"
