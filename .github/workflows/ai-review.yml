name: AI Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: nubster-opensources/.github/.github/workflows/ai-review.yml@4a55945c74571ba6414838297dd2b28af13dddfb # PR 35 idempotence smoke
    with:
      pr-number: ${{ github.event.pull_request.number }}
      mode: review
    secrets:
      mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}

  team:
    uses: nubster-opensources/.github/.github/workflows/ai-review.yml@4a55945c74571ba6414838297dd2b28af13dddfb # PR 35 idempotence smoke
    with:
      pr-number: ${{ github.event.pull_request.number }}
      mode: team
    secrets:
      mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}

  describe:
    uses: nubster-opensources/.github/.github/workflows/ai-review.yml@4a55945c74571ba6414838297dd2b28af13dddfb # PR 35 idempotence smoke
    with:
      pr-number: ${{ github.event.pull_request.number }}
      mode: describe
    secrets:
      mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
