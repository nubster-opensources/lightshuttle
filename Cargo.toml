[workspace]
resolver = "3"
members = [
    "crates/lightshuttle",
    "crates/lightshuttle-control",
    "crates/lightshuttle-export",
    "crates/lightshuttle-manifest",
    "crates/lightshuttle-otel",
    "crates/lightshuttle-secrets",
    "crates/lightshuttle-runtime",
    "crates/lightshuttle-spec",
    "xtask",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nubster-opensources/lightshuttle"
homepage = "https://nubster.com"
authors = ["Nubster"]
keywords = ["orchestrator", "dev-tools", "docker", "polyglot"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
schemars = { version = "1", features = ["indexmap2"] }
thiserror = "2"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.49", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = { version = "0.21", features = ["buildkit", "time"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tar = "0.4"
ignore = "0.4"
bytes = "1"
humantime = "2"
rand = "0.9"
url = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Reading back the start instant the operating system reports for a process
# number. `system` alone drops the disk, network, component, GPU and user
# probes that ship in the default feature set and that nothing here uses.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# Starting a native process in its own group and stopping that whole group.
# Confines the `unsafe` a Windows Job Object needs, which this workspace
# denies outright.
process-wrap = { version = "10.0.1", features = [
    "tokio1",
    "process-group",
    "job-object",
] }
# Sending a signal to a whole process group by number, for a group this
# supervisor did not spawn. `killpg` is a safe wrapper here, which is what
# keeps the workspace free of the FFI that reclaiming would otherwise need.
nix = { version = "0.31", default-features = false, features = ["signal"] }
axum = "0.8"
tower = "0.5"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.29"
askama = "0.16"
humantime-serde = "1"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.33"
tracing-opentelemetry = "0.34"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
